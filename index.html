<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment Finapp - Fast Load</title>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- CONFIGURATION ---
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwL1wNbOrkgIdOmASFpYfGQ7wlwDIYFMNVLg5Q-A6T4d_jzGoH6ZzLq0Xe399GIpiA/exec';

        const VEHICLE_CONFIGS = {
            JCB: {
                name: 'JCB', icon: 'tractor',
                themeColor: 'bg-yellow-500', themeAccentText: 'text-yellow-600', accentBg: 'bg-yellow-500',
                incomeCategories: ['Hourly Work', 'Daily Contract', 'Fixed Project', 'Demolition', 'Other'],
                expenseCategories: ['Diesel', 'Driver Salary/Bata', 'Maintenance', 'Spare Parts', 'EMI/Loan', 'Low-Bed', 'Grease & Oil', 'Other']
            },
            TRACTOR: {
                name: 'Tractor', icon: 'truck',
                themeColor: 'bg-emerald-600', themeAccentText: 'text-emerald-600', accentBg: 'bg-emerald-600',
                incomeCategories: ['Ploughing', 'Rotavator', 'Trolley', 'Harvesting', 'Hourly Rent', 'Other'],
                expenseCategories: ['Diesel', 'Driver Salary/Bata', 'Maintenance', 'Tyre Repairs', 'Spares', 'EMI/Loan', 'Grease & Oil', 'Other']
            }
        };

        // --- CORE APP COMPONENT ---
        function App() {
            const [activeVehicle, setActiveVehicle] = useState('JCB');
            const [view, setView] = useState('dashboard');
            
            // 1. Data State (Initialize from localStorage instantly)
            const [transactions, setTransactions] = useState(() => {
                try { return JSON.parse(localStorage.getItem('equipment_transactions')) || []; } 
                catch (e) { return []; }
            });
            
            const [loans, setLoans] = useState(() => {
                try { return JSON.parse(localStorage.getItem('equipment_loans')) || []; } 
                catch (e) { return []; }
            });

            // 2. Loading State
            const [isInitialLoad, setIsInitialLoad] = useState(transactions.length === 0);
            const [isSyncing, setIsSyncing] = useState(false);
            const [syncError, setSyncError] = useState(false);

            // 3. Network Fetching 
            useEffect(() => {
                setIsSyncing(true);
                setSyncError(false);
                
                fetch(SCRIPT_URL)
                    .then(res => {
                        if (!res.ok) throw new Error("HTTP error");
                        return res.text();
                    })
                    .then(text => {
                        try {
                            const data = JSON.parse(text);
                            if (!Array.isArray(data)) throw new Error("Data not array");

                            const parsed = data.map(item => {
                                let vType = (item.vehicle || '').toString().trim().toUpperCase();
                                if (vType !== 'JCB' && vType !== 'TRACTOR') {
                                    const notesUpper = (item.notes || '').toUpperCase();
                                    vType = notesUpper.includes('[TRACTOR]') ? 'TRACTOR' : 'JCB';
                                }
                                return { ...item, vehicle: vType };
                            });
                            
                            const sortedData = parsed.sort((a, b) => new Date(b.date) - new Date(a.date));
                            setTransactions(sortedData);
                            localStorage.setItem('equipment_transactions', JSON.stringify(sortedData));
                        } catch (err) {
                            console.error("Parse Error. Using cache.", err);
                            setSyncError(true);
                        } finally {
                            setIsInitialLoad(false);
                            setIsSyncing(false);
                        }
                    })
                    .catch(err => {
                        console.error("Fetch failed. Using cache.", err);
                        setSyncError(true);
                        setIsInitialLoad(false);
                        setIsSyncing(false);
                    });
            }, []);

            // 4. Persistence
            useEffect(() => { localStorage.setItem('equipment_loans', JSON.stringify(loans)); }, [loans]);
            useEffect(() => { lucide.createIcons(); });

            // 5. Data Filtering
            const currentConfig = VEHICLE_CONFIGS[activeVehicle];
            const filteredTxns = transactions.filter(t => (t.vehicle || 'JCB') === activeVehicle);
            const filteredLoans = loans.filter(l => (l.vehicle || 'JCB') === activeVehicle);

            // 6. Action Handlers
            const addTransaction = (txn) => {
                const newTxn = { ...txn, vehicle: activeVehicle };
                const updatedTxns = [newTxn, ...transactions].sort((a, b) => new Date(b.date) - new Date(a.date));
                
                setTransactions(updatedTxns);
                localStorage.setItem('equipment_transactions', JSON.stringify(updatedTxns));
                
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(newTxn),
                    redirect: 'follow'
                }).catch(err => console.error("Sync error:", err));
            };

            const addLoan = (newLoan) => {
                setLoans([...loans, { ...newLoan, vehicle: activeVehicle, id: Date.now(), emisiPaid: [] }]);
            };

            const recordEMI = (loanId, amount, date) => {
                const targetLoan = loans.find(l => l.id === loanId);
                setLoans(loans.map(loan => loan.id === loanId ? { ...loan, emisiPaid: [...loan.emisiPaid, { amount, date, id: Date.now() }] } : loan));

                addTransaction({
                    date, amount, category: 'EMI/Loan',
                    partyName: `EMI - ${targetLoan ? targetLoan.bankName : ''}`,
                    notes: `EMI logged for ${targetLoan ? targetLoan.machineName : activeVehicle}`,
                    type: 'expense', id: Date.now()
                });
            };

            if (isInitialLoad && syncError) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen bg-gray-100 p-4">
                        <div className="bg-white p-6 rounded-lg shadow-md text-center max-w-sm">
                            <i data-lucide="wifi-off" className="w-12 h-12 text-red-500 mx-auto mb-4"></i>
                            <h2 className="text-lg font-bold text-gray-800">Connection Error</h2>
                            <p className="text-sm text-gray-600 mt-2">Could not connect to Google Sheets, and no offline data was found.</p>
                            <button onClick={() => window.location.reload()} className="mt-4 bg-gray-900 text-white px-4 py-2 rounded font-bold w-full">Retry Connection</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-md mx-auto bg-white min-h-screen shadow-lg relative flex flex-col">
                    <Header activeVehicle={activeVehicle} setActiveVehicle={setActiveVehicle} config={currentConfig} isSyncing={isSyncing} syncError={syncError} />

                    <main className="p-4 flex-grow overflow-y-auto pb-24">
                        {isInitialLoad ? (
                            <div className="flex flex-col items-center justify-center py-20 text-gray-500">
                                <i data-lucide="loader-2" className="w-8 h-8 animate-spin mb-2 text-yellow-500"></i>
                                <p className="font-bold">Syncing Data...</p>
                            </div>
                        ) : (
                            <>
                                {view === 'dashboard' && <Dashboard transactions={filteredTxns} vehicle={activeVehicle} />}
                                {view === 'charts' && <ChartsView transactions={filteredTxns} vehicle={activeVehicle} />}
                                {view === 'loans' && <LoansView loans={filteredLoans} onAddLoan={addLoan} onRecordEMI={recordEMI} vehicle={activeVehicle} config={currentConfig} />}
                                {view === 'add' && <AddForm onAdd={addTransaction} vehicle={activeVehicle} config={currentConfig} />}
                            </>
                        )}
                    </main>

                    <BottomNav view={view} setView={setView} config={currentConfig} />
                </div>
            );
        }

        // --- HEADER COMPONENT ---
        function Header({ activeVehicle, setActiveVehicle, config, isSyncing, syncError }) {
            return (
                <header className={`${config.themeColor} text-white p-4 shadow flex items-center justify-between z-10 transition-colors`}>
                    <div>
                        <h1 className="text-xl font-bold flex items-center gap-2">
                            <i data-lucide={config.icon} className="w-6 h-6"></i>
                            {config.name} App
                        </h1>
                        <p className="text-xs text-white/90 font-medium flex items-center gap-1">
                            {syncError ? <span className="text-red-200">Offline Mode</span> : isSyncing ? <span>Syncing...</span> : <span>Live Mode</span>}
                        </p>
                    </div>
                    <div className="bg-black/25 p-1 rounded-xl flex items-center gap-1">
                        <button onClick={() => setActiveVehicle('JCB')} className={`px-2 py-1 rounded-lg text-xs font-bold transition ${activeVehicle === 'JCB' ? 'bg-white text-gray-900 shadow' : 'text-white/80'}`}>JCB</button>
                        <button onClick={() => setActiveVehicle('TRACTOR')} className={`px-2 py-1 rounded-lg text-xs font-bold transition ${activeVehicle === 'TRACTOR' ? 'bg-white text-gray-900 shadow' : 'text-white/80'}`}>Tractor</button>
                    </div>
                </header>
            );
        }

        // --- BOTTOM NAV COMPONENT ---
        function BottomNav({ view, setView, config }) {
            const btns = [
                { id: 'dashboard', icon: 'layout-dashboard', label: 'Home' },
                { id: 'charts', icon: 'pie-chart', label: 'Charts' },
                { id: 'add', icon: 'plus', label: 'Add', isPrimary: true },
                { id: 'loans', icon: 'landmark', label: 'Loans' }
            ];

            return (
                <nav className="fixed bottom-0 w-full max-w-md bg-white border-t flex shadow-[0_-2px_10px_rgba(0,0,0,0.05)] z-20">
                    {btns.map(b => (
                        <button key={b.id} onClick={() => setView(b.id)} className={`flex-1 py-3 flex flex-col items-center justify-center ${view === b.id ? config.themeAccentText : 'text-gray-400'}`}>
                            {b.isPrimary ? (
                                <div className={`w-8 h-8 rounded-full flex items-center justify-center mb-1 ${view === b.id ? `${config.accentBg} text-white` : 'bg-gray-200 text-gray-600'}`}>
                                    <i data-lucide={b.icon} className="w-5 h-5"></i>
                                </div>
                            ) : (
                                <i data-lucide={b.icon} className="w-5 h-5 mb-1"></i>
                            )}
                            <span className="text-[10px] font-bold">{b.label}</span>
                        </button>
                    ))}
                </nav>
            );
        }

        // --- DASHBOARD COMPONENT ---
        function Dashboard({ transactions, vehicle }) {
            const totals = useMemo(() => {
                return transactions.reduce((acc, curr) => {
                    const amt = parseFloat(curr.amount) || 0;
                    if (curr.type === 'income') acc.income += amt;
                    if (curr.type === 'expense') {
                        acc.expense += amt;
                        if (curr.category === 'Diesel') acc.diesel += amt;
                    }
                    return acc;
                }, { income: 0, expense: 0, diesel: 0 });
            }, [transactions]);

            const profit = totals.income - totals.expense;

            return (
                <div className="space-y-6">
                    <div className="grid grid-cols-2 gap-4">
                        <div className="bg-green-50 p-4 rounded-lg shadow-sm border border-green-200">
                            <p className="text-[10px] text-green-700 font-bold uppercase tracking-wider">{vehicle} Income</p>
                            <p className="text-xl font-bold text-green-900 mt-1">₹{totals.income.toLocaleString()}</p>
                        </div>
                        <div className="bg-red-50 p-4 rounded-lg shadow-sm border border-red-200">
                            <p className="text-[10px] text-red-700 font-bold uppercase tracking-wider">{vehicle} Expenses</p>
                            <p className="text-xl font-bold text-red-900 mt-1">₹{totals.expense.toLocaleString()}</p>
                        </div>
                        <div className="bg-blue-50 p-4 rounded-lg shadow-sm border border-blue-200 col-span-2 flex justify-between items-center">
                            <div>
                                <p className="text-[10px] text-blue-700 font-bold uppercase tracking-wider">Net Profit</p>
                                <p className={`text-2xl font-bold mt-1 ${profit >= 0 ? 'text-blue-900' : 'text-red-600'}`}>₹{profit.toLocaleString()}</p>
                            </div>
                            <div className="text-right">
                                <p className="text-[10px] text-gray-500 uppercase font-bold">Diesel Cost</p>
                                <p className="text-sm font-bold text-gray-700 mt-1">₹{totals.diesel.toLocaleString()}</p>
                            </div>
                        </div>
                    </div>

                    <div>
                        <h2 className="font-bold text-gray-700 mb-3 border-b pb-2 text-sm">{vehicle} Records ({transactions.length})</h2>
                        {transactions.length === 0 ? (
                            <p className="text-gray-400 text-center text-sm py-8">No records found.</p>
                        ) : (
                            <div className="space-y-3">
                                {transactions.slice(0, 50).map((txn, idx) => ( // Render max 50 to keep UI fast
                                    <div key={txn.id || idx} className="bg-white border rounded-lg p-3 flex justify-between items-center shadow-sm">
                                        <div className="flex items-center gap-3 overflow-hidden">
                                            <div className={`w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 ${txn.type === 'income' ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}`}>
                                                <i data-lucide={txn.type === 'income' ? 'arrow-down-left' : 'arrow-up-right'} className="w-4 h-4"></i>
                                            </div>
                                            <div className="overflow-hidden">
                                                <p className="font-bold text-sm text-gray-800 truncate">{txn.category}</p>
                                                <p className="text-xs text-gray-500 truncate">{txn.date} • {txn.partyName || 'N/A'}</p>
                                            </div>
                                        </div>
                                        <div className="text-right flex-shrink-0 ml-2">
                                            <p className={`font-bold text-sm ${txn.type === 'income' ? 'text-green-600' : 'text-red-600'}`}>
                                                {txn.type === 'income' ? '+' : '-'}₹{parseFloat(txn.amount).toLocaleString()}
                                            </p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // --- CHARTS VIEW COMPONENT ---
        function ChartsView({ transactions, vehicle }) {
            const barRef = useRef(null);
            const lineRef = useRef(null);
            const pieRef = useRef(null);
            const [timeframe, setTimeframe] = useState('monthly');

            useEffect(() => {
                if (transactions.length === 0) return;

                const grouped = {};
                const categories = {};
                
                [...transactions].sort((a,b) => new Date(a.date) - new Date(b.date)).forEach(txn => {
                    if(!txn.date) return;
                    const d = new Date(txn.date);
                    let lbl = timeframe === 'daily' ? d.toLocaleDateString('en-GB', {day:'numeric', month:'short'}) :
                              timeframe === 'monthly' ? d.toLocaleString('default', {month:'short', year:'2-digit'}) :
                              "Wk " + d.toLocaleDateString('en-GB', {day:'numeric', month:'short'}); 
                    
                    if (!grouped[lbl]) grouped[lbl] = { in: 0, out: 0 };
                    const amt = parseFloat(txn.amount) || 0;
                    
                    if (txn.type === 'income') grouped[lbl].in += amt;
                    else { grouped[lbl].out += amt; categories[txn.category] = (categories[txn.category] || 0) + amt; }
                });

                const labels = Object.keys(grouped);
                
                let charts = [];

                if (barRef.current) {
                    charts.push(new Chart(barRef.current, {
                        type: 'bar',
                        data: { labels, datasets: [
                            { label: 'Income', data: labels.map(l => grouped[l].in), backgroundColor: '#16a34a' },
                            { label: 'Expense', data: labels.map(l => grouped[l].out), backgroundColor: '#dc2626' }
                        ]},
                        options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
                    }));
                }

                if (lineRef.current) {
                    charts.push(new Chart(lineRef.current, {
                        type: 'line',
                        data: { labels, datasets: [
                            { label: 'Income', data: labels.map(l => grouped[l].in), borderColor: '#16a34a', backgroundColor: 'rgba(22,163,74,0.1)', fill: true, tension: 0.3 },
                            { label: 'Expense', data: labels.map(l => grouped[l].out), borderColor: '#dc2626', backgroundColor: 'rgba(220,38,38,0.1)', fill: true, tension: 0.3 }
                        ]},
                        options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
                    }));
                }

                if (pieRef.current) {
                    charts.push(new Chart(pieRef.current, {
                        type: 'doughnut',
                        data: { labels: Object.keys(categories), datasets: [{ data: Object.values(categories), backgroundColor: ['#ef4444', '#f97316', '#eab308', '#3b82f6', '#a855f7'] }]},
                        options: { responsive: true, plugins: { legend: { position: 'right', labels: { boxWidth: 10, font: {size: 10} } } } }
                    }));
                }

                return () => charts.forEach(c => c.destroy());
            }, [transactions, timeframe]);

            return (
                <div className="space-y-6">
                    <div className="flex p-1 bg-gray-200 rounded-lg">
                        {['daily', 'monthly'].map(t => (
                            <button key={t} onClick={() => setTimeframe(t)} className={`flex-1 py-1.5 rounded-md text-sm font-bold capitalize ${timeframe === t ? 'bg-white shadow text-gray-900' : 'text-gray-500'}`}>{t}</button>
                        ))}
                    </div>
                    {transactions.length === 0 ? <p className="text-center text-gray-400 py-8">No data to chart.</p> : (
                        <>
                            <div className="bg-white p-3 rounded-lg border shadow-sm"><canvas ref={barRef}></canvas></div>
                            <div className="bg-white p-3 rounded-lg border shadow-sm"><canvas ref={lineRef}></canvas></div>
                            <div className="bg-white p-3 rounded-lg border shadow-sm"><canvas ref={pieRef}></canvas></div>
                        </>
                    )}
                </div>
            );
        }

        // --- LOANS VIEW COMPONENT ---
        function LoansView({ loans, onAddLoan, onRecordEMI, vehicle, config }) {
            const [showAdd, setShowAdd] = useState(false);
            const [payLoanId, setPayLoanId] = useState(null);
            const [formData, setFormData] = useState({});

            const submitAdd = (e) => {
                e.preventDefault();
                onAddLoan(formData);
                setShowAdd(false); setFormData({});
            };

            const submitEmi = (e) => {
                e.preventDefault();
                onRecordEMI(payLoanId, formData.amount, formData.date);
                setPayLoanId(null); setFormData({});
            };

            if (showAdd) return (
                <form onSubmit={submitAdd} className="space-y-3 bg-white p-4 rounded-lg shadow-sm border">
                    <h2 className="font-bold border-b pb-2 flex justify-between">Add Loan <span onClick={() => setShowAdd(false)} className="text-red-500 text-xs cursor-pointer">Cancel</span></h2>
                    <input type="text" placeholder="Machine Name" required onChange={e => setFormData({...formData, machineName: e.target.value})} className="w-full border p-2 rounded bg-gray-50 text-sm" />
                    <input type="text" placeholder="Bank Name" required onChange={e => setFormData({...formData, bankName: e.target.value})} className="w-full border p-2 rounded bg-gray-50 text-sm" />
                    <input type="number" placeholder="Total Loan Amount" required onChange={e => setFormData({...formData, totalLoanAmount: e.target.value})} className="w-full border p-2 rounded bg-gray-50 text-sm" />
                    <input type="number" placeholder="Downpayment" required onChange={e => setFormData({...formData, downPayment: e.target.value})} className="w-full border p-2 rounded bg-gray-50 text-sm" />
                    <div className="grid grid-cols-2 gap-2">
                        <input type="number" placeholder="Monthly EMI" required onChange={e => setFormData({...formData, emiAmount: e.target.value})} className="w-full border p-2 rounded bg-gray-50 text-sm" />
                        <input type="number" placeholder="Tenure (Months)" required onChange={e => setFormData({...formData, totalMonths: e.target.value})} className="w-full border p-2 rounded bg-gray-50 text-sm" />
                    </div>
                    <button type="submit" className={`w-full py-2 text-white font-bold rounded ${config.accentBg}`}>Save Loan</button>
                </form>
            );

            if (payLoanId) return (
                <form onSubmit={submitEmi} className="space-y-3 bg-white p-4 rounded-lg shadow-sm border">
                    <h2 className="font-bold border-b pb-2 flex justify-between">Pay EMI <span onClick={() => setPayLoanId(null)} className="text-red-500 text-xs cursor-pointer">Cancel</span></h2>
                    <input type="date" required onChange={e => setFormData({...formData, date: e.target.value})} className="w-full border p-2 rounded bg-gray-50 text-sm" />
                    <input type="number" placeholder="Amount Paid" required onChange={e => setFormData({...formData, amount: e.target.value})} className="w-full border p-2 rounded bg-gray-50 text-sm font-bold" />
                    <button type="submit" className="w-full py-2 text-white font-bold rounded bg-green-600">Confirm Payment</button>
                </form>
            );

            return (
                <div className="space-y-4">
                    <button onClick={() => setShowAdd(true)} className={`w-full py-2 text-white font-bold rounded flex items-center justify-center gap-1 ${config.accentBg}`}>
                        <i data-lucide="plus" className="w-4 h-4"></i> Add New Loan
                    </button>
                    {loans.map(l => (
                        <div key={l.id} className="bg-white p-4 rounded-lg shadow-sm border text-sm">
                            <div className="flex justify-between font-bold mb-2"><span>{l.machineName}</span><span className="text-red-600">₹{l.emiAmount}</span></div>
                            <p className="text-xs text-gray-500 mb-2">{l.bankName} • {l.emisiPaid.length}/{l.totalMonths} Paid</p>
                            <button onClick={() => { setPayLoanId(l.id); setFormData({amount: l.emiAmount}); }} className="w-full py-1.5 border border-blue-200 text-blue-700 bg-blue-50 rounded font-bold mt-2 text-xs">Pay EMI</button>
                        </div>
                    ))}
                </div>
            );
        }

        // --- ADD TRANSACTION FORM ---
        function AddForm({ onAdd, vehicle, config }) {
            const [type, setType] = useState('income');
            const [formData, setFormData] = useState({ date: new Date().toISOString().split('T')[0], amount: '', category: config.incomeCategories[0], partyName: '', notes: '' });

            useEffect(() => setFormData(p => ({ ...p, category: type === 'income' ? config.incomeCategories[0] : config.expenseCategories[0] })), [vehicle, type]);

            const submit = (e) => {
                e.preventDefault();
                onAdd({ ...formData, type, id: Date.now() });
                setFormData({ ...formData, amount: '', partyName: '', notes: '' }); // Reset partial
            };

            return (
                <form onSubmit={submit} className="space-y-4">
                    <div className="flex p-1 bg-gray-200 rounded-lg">
                        <button type="button" onClick={() => setType('income')} className={`flex-1 py-2 rounded-md text-sm font-bold ${type === 'income' ? 'bg-white text-green-600 shadow' : 'text-gray-500'}`}>Income</button>
                        <button type="button" onClick={() => setType('expense')} className={`flex-1 py-2 rounded-md text-sm font-bold ${type === 'expense' ? 'bg-white text-red-600 shadow' : 'text-gray-500'}`}>Expense</button>
                    </div>
                    <input type="date" required value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} className="w-full border p-2 rounded bg-gray-50 text-sm" />
                    <input type="number" required placeholder="Amount" value={formData.amount} onChange={e => setFormData({...formData, amount: e.target.value})} className="w-full border p-3 rounded bg-gray-50 text-lg font-bold" />
                    <select value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} className="w-full border p-2 rounded bg-gray-50 text-sm">
                        {(type === 'income' ? config.incomeCategories : config.expenseCategories).map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                    <input type="text" placeholder="Party Name" value={formData.partyName} onChange={e => setFormData({...formData, partyName: e.target.value})} className="w-full border p-2 rounded bg-gray-50 text-sm" />
                    <input type="text" placeholder="Notes / Hours" value={formData.notes} onChange={e => setFormData({...formData, notes: e.target.value})} className="w-full border p-2 rounded bg-gray-50 text-sm" />
                    <button type="submit" className={`w-full py-3 rounded font-bold text-white ${type === 'income' ? 'bg-green-600' : 'bg-red-600'}`}>Save {type}</button>
                </form>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
